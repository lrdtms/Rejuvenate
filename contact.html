<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rejuvenate | Contact</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html">
      <img class="brand-logo" src="Reference/rejuvenateLogo.svg" alt="Rejuvenate logo">
      <span>Rejuvenate</span>
    </a>
    <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <nav id="primary-nav" class="site-nav" aria-label="Primary navigation">
      <ul class="menu">
        <li><a class="nav-link" href="index.html">Home</a></li>
        <li><a class="nav-link" href="about.html">About</a></li>
        <li class="has-dropdown">
          <button class="dropdown-toggle nav-link" type="button" aria-expanded="false" aria-controls="locations-menu-contact">locations</button>
          <ul id="locations-menu-contact" class="submenu" aria-label="Locations submenu">
            <li><a href="cape-town.html">Cape Town</a></li>
            <li><a href="durban.html">Durban</a></li>
          </ul>
        </li>
        <li><a class="nav-link active" href="contact.html">Contact</a></li>
      </ul>
    </nav>
  </header>

  <main class="inner-page">
    <section class="contact-intro">
      <h1>Contact Us</h1>
      <p>We would love to pray with you and answer your questions.</p>
    </section>

    <section class="contact-layout">
      <article class="card">
        <h2>Reach Out</h2>
        <p>Email: hello@rejuvenate.org</p>
        <p>Phone: +27 00 000 0000</p>
        <p>Replace these placeholders with your official details.</p>
      </article>

      <form class="card contact-form" action="#" method="post">
        <h2>Send A Message</h2>
        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="you@example.com" required>

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" placeholder="How can we help?"></textarea>

        <button type="submit">Submit</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
